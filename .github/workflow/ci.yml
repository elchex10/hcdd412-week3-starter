# Name of the workflow shown in the GitHub Actions tab
name: CI

# Trigger this workflow automatically on every push to the main branch
on:
  push:
    branches: [ main ]

jobs:
  # Single job that handles installing dependencies, testing, and building
  build-and-test:
    # Run on a clean Ubuntu virtual machine provided by GitHub
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository files onto the runner machine
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 20 and cache dependencies for faster future runs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Clean install exact dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Step 4: Run the test suite to verify code works before building
      - name: Run tests
        run: npm test

      # Step 5: Run the build script to generate the dist/ output folder
      - name: Build project
        run: npm run build

      # Step 6: Save and archive the dist/ output as a downloadable artifact
      - name: Archive build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
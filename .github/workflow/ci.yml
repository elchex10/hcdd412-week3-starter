# ==============================================================================
# Workflow Name: Displayed in the GitHub repository Actions tab
# ==============================================================================
name: CI

# ==============================================================================
# Trigger: Automatically runs on every push commit to the main branch
# ==============================================================================
on:
  push:
    branches: [ main ]

# ==============================================================================
# Jobs: Automated tasks executed on a GitHub-hosted virtual environment
# ==============================================================================
jobs:
  build-and-test:
    # Runs the job on a clean, standard Ubuntu Linux runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out and clone repository files onto the runner
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime (v20) and enable npm dependency caching
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Clean install exact project dependencies using package-lock.json
      - name: Install dependencies
        run: npm ci

      # Step 4: Execute automated unit test suite (all 8 tests must pass)
      - name: Run tests
        run: npm test

      # Step 5: Execute project build script to output bundled assets into dist/
      - name: Build project
        run: npm run build

      # Step 6: Archive the dist/ output folder as a downloadable build artifact
      - name: Archive build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
